[Display]
; Window size. PSP is 480x272. Scale multiplies that by Scale.
; Custom uses Width and Height. Desktop uses the monitor.
; LCS_WINDOW_SCALE, when set to 1..8, overrides this size.
ResolutionMode=Scale
Scale=2
Fullscreen=false
UpscaleFilter=Bilinear
IntegerScale=false
ShowFPS=false
VSync=true
HudScale=0.75

[Rendering]
Backend=DirectX12 ; Windows uses DirectX 12. Linux selects the Vulkan GE for this value.
; GE render target. PSP is 480x272. Scale multiplies that by InternalScale.
; Custom uses InternalWidth and InternalHeight. Desktop uses the monitor.
InternalResolutionMode=Scale
InternalScale=3
MSAA=1
AnisotropicFiltering=1
; Extra mip bias added to the game's. Negative keeps textures sharper farther away.
TextureLodBias=0
; View distance: LOD distance and draw distance, plus far clip and fog.
; 1 is the original. 4 is the highest. Does not fade the swap to the detailed model.
ViewDistance=1.00

[Widescreen]
Enabled=true
AspectRatio=auto

[Controls]
MouseSensitivity=12
CameraSmoothing=50

[Timing]
; 30 is the pace the missions were written for. 60 turns that wait off.
FrameRate=30
